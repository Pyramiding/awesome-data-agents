name: 推荐资料 / Suggest a resource
description: 推荐有原始来源、日期证据和技术价值的 Data Agent 资料。
title: "[Resource] "
body:
  - type: markdown
    attributes:
      value: |
        中文和英文都欢迎。提交建议不需要先编辑 JSON。
        请先搜索 README、机器索引和已有 Issue，避免重复收录。
  - type: input
    id: title
    attributes:
      label: 原始标题 / Original title
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 原始链接 / Canonical URL
      description: 优先作者、项目、论文或大会的一手页面。
    validations:
      required: true
  - type: textarea
    id: date
    attributes:
      label: 日期与证据 / Date and evidence
      description: 写明发布日期、活动日期或 2026 年重要更新日期，并附核验链接；无法确认时请明确说明。
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 资料类型 / Resource type
      options:
        - 架构与实践 / Architecture and practice
        - 公开实现 / Public implementation
        - 论文 / Research
        - 评测 / Evaluation
        - 分享或议程 / Talk or agenda
        - 持续文档 / Living documentation
    validations:
      required: true
  - type: textarea
    id: takeaway
    attributes:
      label: 为什么值得收录 / Reusable takeaway
      description: 用两三句话说明解决的问题、技术机制、证据边界，以及读者可以复用什么。
    validations:
      required: true
  - type: textarea
    id: caveats
    attributes:
      label: 状态与限制 / Status and caveats
      description: 如厂商自述、内部评测、仅有议程、EAP、已归档、许可证不明。实现类请附组件类型、许可证和技术文档链接。
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: 语言与标签 / Language and tags
    validations:
      required: false

